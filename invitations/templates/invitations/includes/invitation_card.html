<article class="card invitation-card mb-3">
    <div class="card-body">
        <h2 class="card-title h5">
            {{ invitation.guest_name }} → {{ invitation.event_name }}
        </h2>
        <p class="card-text text-muted mb-1">
            <strong>Дата события:</strong> {{ invitation.event_date }}
        </p>
        <p class="card-text mb-3">
            <strong>Статус:</strong>
            {% include "invitations/includes/invitation_status.html" %}
        </p>
        <a href="{% url 'invitations:detail' invitation.id %}" class="btn btn-primary">
            Подробнее
        </a>
    </div>
</article>
