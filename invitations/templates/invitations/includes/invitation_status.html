{% if invitation.status_code == 'confirmed' %}
    <span class="badge bg-success invitation-status">
        Подтверждено
    </span>
{% elif invitation.status_code == 'pending' %}
    <span class="badge bg-warning text-dark invitation-status">
        Ожидает ответа
    </span>
{% else %}
    <span class="badge bg-secondary invitation-status">
        {{ invitation.status_title|default:"Отклонено" }}
    </span>
{% endif %}
