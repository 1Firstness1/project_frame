{% if invitation.is_confirmed %}
    <span class="badge bg-success invitation-status">
        Подтверждено
    </span>
{% elif invitation.is_pending %}
    <span class="badge bg-warning text-dark invitation-status">
        Ожидает ответа
    </span>
{% else %}
    <span class="badge bg-secondary invitation-status">
        {{ invitation.status.title|default:"Отклонено" }}
    </span>
{% endif %}
