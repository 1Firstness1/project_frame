{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис гостей{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="container py-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <a href="{% url 'homepage:index' %}" class="d-flex align-items-center text-decoration-none">
                <img src="{% static 'homepage/img/logo.png' %}"
                     alt="Сервис гостей"
                     class="guestlist-logo me-2">
                <span class="fs-4 fw-bold text-dark">Сервис гостей</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="container mt-4 mb-3 border-top pt-3 text-muted">
        <p>© <span id="current-year"></span> Сервис гостей</p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
